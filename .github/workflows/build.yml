name: Build MD-UV390 10W firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        aes: ["0", "1"]
    name: build (ENABLE_AES=${{ matrix.aes }})
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: Build
        working-directory: MDUV380_firmware
        run: make -j$(nproc) ENABLE_AES=${{ matrix.aes }}
      - name: Report size
        working-directory: MDUV380_firmware
        run: arm-none-eabi-size build/openuv380-10w.elf
      - name: Assert codec-merge-capable size
        working-directory: MDUV380_firmware
        run: |
          sz=$(stat -c%s build/openuv380-10w.bin)
          echo "firmware .bin size: $sz bytes"
          # має бути >= зміщення запису кодека (0x6937C) + розмір кодека (0x48BB0) = 728876
          test "$sz" -ge 728876 || { echo "ERROR: .bin too small to receive the AMBE codec merge (FM-only)"; exit 1; }
          echo "OK: reserved codec region present, ready for flash-time merge."
      - uses: actions/upload-artifact@v4
        with:
          name: openuv380-10w-aes${{ matrix.aes }}
          path: |
            MDUV380_firmware/build/*.bin
            MDUV380_firmware/build/*.hex
            MDUV380_firmware/build/*.elf

  # Українська збірка: окрема робота, а не ще один пункт матриці вище, щоб не чіпати
  # наявні перевірки. Дає готовий .bin, який можна прошити з будь-якої ОС -- локальний
  # тулчейн для цього не потрібен (а на Windows/macOS збірка й неможлива: Makefile
  # викликає tools/codec_cleaner.Linux, x86-64 ELF).
  build-ukrainian:
    runs-on: ubuntu-latest
    name: build (українська, ENABLE_AES=1 ENABLE_DMR_DATA=1)
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: Build
        working-directory: MDUV380_firmware
        run: make -j$(nproc) LANGUAGE_UKRAINIAN=1 ENABLE_AES=1 ENABLE_DMR_DATA=1
      - name: Report size
        working-directory: MDUV380_firmware
        run: arm-none-eabi-size build/openuv380-10w.elf
      # Артефакт вивантажуємо ДО перевірок: якщо якась із них колись спрацює хибно,
      # зібраний .bin все одно має лишитись доступним для завантаження.
      - uses: actions/upload-artifact@v4
        with:
          name: openuv380-10w-ukrainian
          path: |
            MDUV380_firmware/build/*.bin
            MDUV380_firmware/build/*.hex
            MDUV380_firmware/build/*.elf
      - name: Assert codec-merge-capable size
        working-directory: MDUV380_firmware
        run: |
          sz=$(stat -c%s build/openuv380-10w.bin)
          echo "firmware .bin size: $sz bytes"
          test "$sz" -ge 728876 || { echo "ERROR: .bin too small to receive the AMBE codec merge (FM-only)"; exit 1; }
          echo "OK: reserved codec region present, ready for flash-time merge."
      - name: Assert Ukrainian strings are actually linked in
        working-directory: MDUV380_firmware
        run: |
          # "Мова" (menu language) у cp1251 -- саме так рядки лежать у ukrainian.h.
          # Якщо прапорець не спрацював, у прошивці буде англійський "Language".
          python3 - <<'PY'
          data = open("build/openuv380-10w.bin","rb").read()
          needle = "Мова".encode("cp1251")
          assert needle in data, "українських рядків у .bin немає -- LANGUAGE_UKRAINIAN=1 не спрацював"
          print("OK: українські рядки знайдено у прошивці")
          PY
